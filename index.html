<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion pieces — Swaraj Patil</title>
<style>
  @font-face{font-family:'Fraunces';src:url('unicus-estate/fonts/fraunces-300.woff2') format('woff2');font-weight:300;font-display:swap}
  @font-face{font-family:'Inter';src:url('unicus-estate/fonts/inter.woff2') format('woff2');font-weight:100 900;font-display:swap}
  body{
    margin:0;min-height:100vh;background:#0A100D;color:#F4F1E9;
    font-family:'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;box-sizing:border-box;
    background-image:radial-gradient(900px 600px at 50% 0%, rgba(195,154,92,.10), transparent 70%);
  }
  main{width:100%;max-width:520px}
  .eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#C39A5C;margin:0 0 18px}
  h1{font-family:'Fraunces',serif;font-weight:300;font-size:38px;line-height:1.1;margin:0 0 34px;letter-spacing:-.02em}
  a.card{
    display:block;text-decoration:none;color:inherit;border:1px solid rgba(244,241,233,.14);
    border-radius:16px;padding:22px 24px;background:rgba(244,241,233,.03);transition:border-color .25s,background .25s,transform .25s;
  }
  a.card:hover{border-color:rgba(195,154,92,.6);background:rgba(195,154,92,.07);transform:translateY(-2px)}
  .card h2{font-family:'Fraunces',serif;font-weight:300;font-size:22px;margin:0 0 6px}
  .card p{margin:0;font-size:12.5px;line-height:1.6;color:rgba(244,241,233,.55)}
  .tag{display:inline-block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9FB0A4;margin-bottom:10px}
  footer{margin-top:34px;font-size:11px;color:rgba(244,241,233,.32);letter-spacing:.06em}
  footer a{color:#C39A5C;text-decoration:none}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Motion</p>
  <h1>Reels and animated pieces.</h1>

  <a class="card" href="unicus-estate/">
    <span class="tag">30s · vertical · 1080×1920</span>
    <h2>Unicus Estate — concept reel</h2>
    <p>A broken link, a hill estate, and a masterplan you can tap. Built entirely in code, frame by frame.</p>
  </a>

  <footer>Swaraj Patil · <a href="https://swarajpatil1.netlify.app">swarajpatil1.netlify.app</a></footer>
</main>
</body>
</html>
