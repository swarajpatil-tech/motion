<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicus Estate — motion piece (review)</title>
<meta name="theme-color" content="#070A09">
<style>
@font-face{
  font-family:'Fraunces';
  src:url('fonts/fraunces-300.woff2') format('woff2');
  font-weight:300; font-style:normal; font-display:block;
}
@font-face{
  font-family:'Fraunces';
  src:url('fonts/fraunces-italic-300.woff2') format('woff2');
  font-weight:300; font-style:italic; font-display:block;
}
@font-face{
  font-family:'Inter';
  src:url('fonts/inter.woff2') format('woff2');
  font-weight:100 900; font-style:normal; font-display:block;
}

:root{
  --bg:#070A09;
  --panel:#0E1613;
  --line:rgba(244,241,233,.12);
  --paper:#F4F1E9;
  --brass:#C39A5C;
  --sage:#9FB0A4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1100px 700px at 50% -10%, rgba(195,154,92,.07), transparent 70%),
    var(--bg);
  color:var(--paper);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:18px 16px 26px;gap:14px;
  -webkit-font-smoothing:antialiased;
}

header{width:100%;max-width:560px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{
  font-family:'Fraunces',serif;font-weight:300;font-size:20px;margin:0;
  letter-spacing:-.01em;
}
header span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage)}

.stagewrap{position:relative;display:flex;justify-content:center}
canvas#stage{
  height:min(72vh, 780px);
  width:auto;
  aspect-ratio:9 / 16;
  border-radius:16px;
  background:#0A100D;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(244,241,233,.07);
  display:block;
}

/* controls */
.controls{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
button{
  font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper);background:#111B17;border:1px solid var(--line);
  padding:9px 14px;border-radius:999px;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s;
}
button:hover{background:#182520;border-color:rgba(195,154,92,.5)}
button:disabled{opacity:.5;cursor:default}
#clock{
  font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.06em;
  color:var(--sage);margin-left:auto;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;
  background:linear-gradient(90deg,rgba(195,154,92,.6),rgba(244,241,233,.14));
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--brass);border:2px solid #0A100D;cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--brass);
  border:2px solid #0A100D;cursor:pointer;
}

#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:10.5px;letter-spacing:.09em;padding:6px 11px;border-radius:999px;
  background:transparent;border:1px solid var(--line);color:rgba(244,241,233,.6);
}
.chip.on{border-color:var(--brass);color:var(--brass);background:rgba(195,154,92,.10)}

.note{
  max-width:560px;font-size:11.5px;line-height:1.65;color:rgba(244,241,233,.45);
  margin:0;
}
.note b{color:rgba(244,241,233,.72);font-weight:500}

/* loading */
#load{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:50;transition:opacity .4s;
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--sage);
}
body:not(.loading) #load{opacity:0;pointer-events:none}

/* frozen frame mode: /?t=12.4 */
body.frozen{padding:0;gap:0;background:#000}
body.frozen header,
body.frozen .controls,
body.frozen .note{display:none}
body.frozen #load{display:none}
body.frozen canvas#stage{
  height:100vh;border-radius:0;box-shadow:none;
}

@media (max-width:520px){
  canvas#stage{height:min(64vh, 600px)}
  header h1{font-size:17px}
}
</style>
</head>
<body class="loading">

<div id="load">Loading the reel</div>

<header>
  <h1>Unicus Estate — motion piece</h1>
  <span>1080 × 1920 · 30s</span>
</header>

<div class="stagewrap">
  <canvas id="stage" width="1080" height="1920"></canvas>
</div>

<div class="controls">
  <input id="scrub" type="range" min="0" max="30" step="0.0333" value="0">
  <div class="row">
    <button id="play">Pause</button>
    <button id="restart">Replay</button>
    <span id="clock">00:00.00</span>
  </div>
  <div id="chips"></div>
  <div class="row">
    <button id="record">Record video</button>
  </div>
  <p class="note">
    <b>Review:</b> drag the timeline to scrub, or use the space bar to play and pause, arrow keys to step one frame.
    Scene buttons jump to a beat. <b>Record video</b> plays the whole thing and saves it as a file you can drop into Instagram.
  </p>
</div>

<script src="reel.js"></script>
</body>
</html>
